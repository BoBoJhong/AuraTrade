[pytest]
# Pytest Configuration for AuraTrade Backend
# Generated by Sentinel Test Architect

# Test discovery
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests
norecursedirs = .git __pycache__ node_modules venv .venv dist build

# Output options
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=apps
    --cov-report=html:tests/reports/htmlcov
    --cov-report=term-missing
    --cov-fail-under=70
    -ra

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    critical: Critical path tests
    requires_api: Tests requiring external API
    requires_db: Tests requiring database

# Asyncio
asyncio_mode = auto

# Coverage
[coverage:run]
source = apps
omit = 
    */tests/*
    */migrations/*
    */alembic/*
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
